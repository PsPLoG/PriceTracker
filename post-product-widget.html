<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게시글 상품 리스트</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,"Noto Sans KR",sans-serif;color:#202124}body{padding:10px}.wrap{max-width:920px;margin:auto}.head{padding:17px;margin-bottom:12px;border:1px solid #fed7aa;border-radius:16px;background:#fff7ed}.head h2{margin:0 0 6px;font-size:22px}.head p{margin:0;color:#6b7280;font-size:14px}.count{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:999px;background:#ffedd5;color:#c2410c;font-size:12px;font-weight:700}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:170px minmax(0,1fr);overflow:hidden;border:1px solid #e5e7eb;border-radius:16px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.06)}.media{position:relative;min-height:170px;background:#f3f4f6}.media img{display:block;width:100%;height:100%;object-fit:cover}.placeholder{height:100%;min-height:170px;display:flex;align-items:center;justify-content:center;color:#9ca3af}.badge{position:absolute;top:9px;left:9px;padding:4px 8px;border-radius:999px;background:#111827;color:#fff;font-size:11px;font-weight:700}.body{padding:15px;min-width:0}.name{margin:0 0 7px;font-size:18px}.note{margin:0 0 10px;color:#6b7280;font-size:13px}.prices{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.sale{font-size:21px;font-weight:800;color:#d92d20}.original{text-decoration:line-through;color:#9ca3af;font-size:13px}.discount{color:#d92d20;font-size:12px;font-weight:700}.coupon{display:inline-block;margin-top:10px;padding:7px 9px;border:1px dashed #fb923c;border-radius:8px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:700}.actions{display:flex;gap:8px;margin-top:12px}.buy,.copy{border:0;border-radius:9px;padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}.buy{background:#ff5a1f;color:#fff}.copy{background:#f3f4f6;color:#374151}.status{padding:18px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;text-align:center;color:#6b7280}.error{color:#b42318;background:#fff4f2;border-color:#fecdca}@media(max-width:600px){body{padding:7px}.card{grid-template-columns:108px minmax(0,1fr)}.media,.placeholder{min-height:145px}.body{padding:12px}.name{font-size:15px}.sale{font-size:18px}}
</style>
</head>
<body>
<main id="app" class="wrap"><div class="status">상품을 불러오는 중입니다.</div></main>
<script>
const q=new URLSearchParams(location.search),api=q.get('api')||'',postKey=q.get('post')||'',app=document.getElementById('app');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function url(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}}
function money(v,c){const n=Number(v);if(!Number.isFinite(n)||n<=0)return '';try{return new Intl.NumberFormat('ko-KR',{style:'currency',currency:c||'USD'}).format(n)}catch(e){return n.toLocaleString('ko-KR')+' '+(c||'USD')}}
function rate(o,s){o=Number(o);s=Number(s);return o>0&&s>0&&s<o?Math.round((1-s/o)*100):0}
function resize(){parent.postMessage({type:'priceTrackerResize',height:Math.ceil(document.documentElement.scrollHeight),post:postKey},'*')}
function fail(m){app.innerHTML='<div class="status error">'+esc(m)+'</div>';resize()}
function card(p,i){const href=url(p.url)||'#',img=url(p.image)?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" loading="lazy">':'<div class="placeholder">이미지 없음</div>',sale=money(p.sale_price,p.currency),original=money(p.original_price,p.currency),dc=rate(p.original_price,p.sale_price);return '<article class="card"><div class="media">'+img+(p.badge?'<span class="badge">'+esc(p.badge)+'</span>':'')+'</div><div class="body"><h3 class="name">'+esc(p.name||('상품 '+(i+1)))+'</h3>'+(p.note?'<p class="note">'+esc(p.note)+'</p>':'')+'<div class="prices">'+(sale?'<span class="sale">'+sale+'</span>':'')+(original?'<span class="original">'+original+'</span>':'')+(dc?'<span class="discount">'+dc+'% 할인</span>':'')+'</div>'+(p.coupon_code?'<div class="coupon">쿠폰 '+esc(p.coupon_code)+'</div>':'')+'<div class="actions"><a class="buy" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer sponsored">상품 보기</a>'+(p.coupon_code?'<button class="copy" data-code="'+esc(p.coupon_code)+'">쿠폰 복사</button>':'')+'</div></div></article>'}
function render(payload){const post=payload&&payload.data?payload.data:payload,products=post&&Array.isArray(post.products)?post.products:[];if(!products.length)return fail('등록된 상품이 없습니다.');app.innerHTML='<header class="head"><h2>'+esc(post.title||'추천 상품 모음')+'</h2>'+(post.description?'<p>'+esc(post.description)+'</p>':'')+'<span class="count">총 '+products.length+'개 상품</span></header><section class="list">'+products.map(card).join('')+'</section>';document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.code);const t=b.textContent;b.textContent='복사 완료';setTimeout(()=>b.textContent=t,1200)}catch(e){prompt('쿠폰 코드를 복사하세요.',b.dataset.code)}});document.querySelectorAll('img').forEach(i=>i.onload=resize);resize();setTimeout(resize,250)}
async function load(){if(!api)return fail('api 파라미터가 없습니다.');if(!postKey)return fail('post 파라미터가 없습니다.');try{const r=await fetch(api+(api.includes('?')?'&':'?')+'mode=json&post='+encodeURIComponent(postKey),{cache:'no-store'}),j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||'데이터 오류');render(j)}catch(e){fail('상품 데이터를 불러오지 못했습니다: '+e.message)}}
new ResizeObserver(resize).observe(document.body);load();
</script>
</body>
</html>
