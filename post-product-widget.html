<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 상품 리스트 위젯</title>
  <style>
    :root{--bg:#f7f8fa;--card:#fff;--text:#17191c;--muted:#6b7280;--line:#e5e7eb;--accent:#ff5a1f;--accent-soft:#fff1eb;--sale:#d92d20}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}body{padding:12px}.widget{max-width:920px;margin:0 auto}.header{padding:18px 20px;background:linear-gradient(135deg,#fff7ed,#fff);border:1px solid #fed7aa;border-radius:18px;margin-bottom:12px}.header h2{margin:0;font-size:22px;line-height:1.35}.header p{margin:7px 0 0;color:var(--muted);font-size:14px}.count{display:inline-flex;margin-top:10px;padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px}.list{display:grid;gap:12px}.card{display:grid;grid-template-columns:180px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(17,24,39,.06)}.image-wrap{position:relative;background:var(--bg);min-height:180px}.image-wrap img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{height:100%;min-height:180px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:13px}.badge{position:absolute;top:10px;left:10px;padding:5px 8px;border-radius:999px;background:rgba(17,24,39,.86);color:#fff;font-size:11px;font-weight:700}.body{padding:17px;min-width:0}.name{margin:0 0 7px;font-size:18px;line-height:1.4}.note{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.55}.prices{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin-bottom:12px}.sale{font-size:22px;font-weight:800;color:var(--sale)}.original{text-decoration:line-through;color:#9ca3af;font-size:13px}.discount{font-weight:800;color:var(--sale);font-size:13px}.coupon{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border:1px dashed #fb923c;background:#fff7ed;color:#c2410c;border-radius:9px;font-size:12px;font-weight:700;margin-bottom:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.buy,.copy{appearance:none;border:0;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none}.buy{background:var(--accent);color:#fff}.copy{background:#f3f4f6;color:#374151}.status{padding:20px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:center;color:var(--muted)}.error{color:#b42318;background:#fff4f2;border-color:#fecdca}@media(max-width:620px){body{padding:8px}.header{padding:15px}.header h2{font-size:19px}.card{grid-template-columns:112px minmax(0,1fr)}.image-wrap,.placeholder{min-height:150px}.body{padding:13px}.name{font-size:15px}.sale{font-size:18px}.note{font-size:12px}.buy,.copy{padding:9px 11px}}
  </style>
</head>
<body>
  <main id="app" class="widget"><div class="status">상품을 불러오는 중입니다.</div></main>
  <script>
    const qs=new URLSearchParams(location.search);
    const API_URL=qs.get('api')||'';
    const POST_KEY=qs.get('post')||'';
    const app=document.getElementById('app');

    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function validUrl(v){try{const u=new URL(v);return u.protocol==='http:'||u.protocol==='https:';}catch(e){return false;}}
    function money(v,currency){const n=Number(v);if(!Number.isFinite(n)||n<=0)return '';try{return new Intl.NumberFormat('ko-KR',{style:'currency',currency:currency||'USD'}).format(n);}catch(e){return n.toLocaleString('ko-KR')+' '+(currency||'USD');}}
    function discount(original,sale){const o=Number(original),s=Number(sale);return o>0&&s>0&&s<o?Math.round((1-s/o)*100):0;}
    function notifyHeight(){const height=Math.ceil(document.documentElement.scrollHeight);parent.postMessage({type:'priceTrackerResize',height,post:POST_KEY},'*');}
    function error(message){app.innerHTML='<div class="status error">'+esc(message)+'</div>';notifyHeight();}
    function productCard(product,index){
      const url=validUrl(product.url)?product.url:'#';
      const image=validUrl(product.image)?'<img src="'+esc(product.image)+'" alt="'+esc(product.name)+'" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=&quot;placeholder&quot;>이미지 없음</div>\'">':'<div class="placeholder">이미지 없음</div>';
      const sale=money(product.sale_price,product.currency);
      const original=money(product.original_price,product.currency);
      const rate=discount(product.original_price,product.sale_price);
      const coupon=product.coupon_code?'<div class="coupon">쿠폰 <span>'+esc(product.coupon_code)+'</span></div>':'';
      const copy=product.coupon_code?'<button class="copy" data-code="'+esc(product.coupon_code)+'">쿠폰 복사</button>':'';
      return '<article class="card">'+
        '<div class="image-wrap">'+image+(product.badge?'<span class="badge">'+esc(product.badge)+'</span>':'')+'</div>'+
        '<div class="body"><h3 class="name">'+esc(product.name||('상품 '+(index+1)))+'</h3>'+
        (product.note?'<p class="note">'+esc(product.note)+'</p>':'')+
        '<div class="prices">'+(sale?'<span class="sale">'+sale+'</span>':'')+(original?'<span class="original">'+original+'</span>':'')+(rate?'<span class="discount">'+rate+'% 할인</span>':'')+'</div>'+
        coupon+'<div class="actions"><a class="buy" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer sponsored">상품 보기</a>'+copy+'</div></div></article>';
    }
    function render(data){
      const post=data.post||data;
      const products=Array.isArray(post.products)?post.products:[];
      if(!products.length){error('등록된 상품이 없습니다.');return;}
      app.innerHTML='<section class="header"><h2>'+esc(post.title||'추천 상품 모음')+'</h2>'+(post.description?'<p>'+esc(post.description)+'</p>':'')+'<span class="count">총 '+products.length+'개 상품</span></section><section class="list">'+products.map(productCard).join('')+'</section>';
      document.querySelectorAll('.copy').forEach(btn=>btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(btn.dataset.code);const old=btn.textContent;btn.textContent='복사 완료';setTimeout(()=>btn.textContent=old,1200);}catch(e){prompt('쿠폰 코드를 복사하세요.',btn.dataset.code);}}));
      document.querySelectorAll('img').forEach(img=>img.addEventListener('load',notifyHeight));
      notifyHeight();setTimeout(notifyHeight,250);
    }
    async function load(){
      if(!API_URL){error('api 파라미터가 없습니다.');return;}
      if(!POST_KEY){error('post 파라미터가 없습니다.');return;}
      try{
        const join=API_URL.includes('?')?'&':'?';
        const response=await fetch(API_URL+join+'mode=json&post='+encodeURIComponent(POST_KEY),{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        const data=await response.json();
        if(data.ok===false)throw new Error(data.message||'상품 데이터를 불러오지 못했습니다.');
        render(data);
      }catch(e){error('상품 데이터를 불러오지 못했습니다: '+e.message);}
    }
    new ResizeObserver(notifyHeight).observe(document.body);
    load();
  </script>
</body>
</html>
