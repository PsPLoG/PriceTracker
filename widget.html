<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가격 위젯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: transparent; }
        
        @media (max-width: 768px) {
            .mobile-text-sm { font-size: 0.75rem !important; }
            .mobile-text-base { font-size: 0.875rem !important; }
            .mobile-text-lg { font-size: 1rem !important; }
            .mobile-text-xl { font-size: 1.125rem !important; }
            .mobile-text-2xl { font-size: 1.25rem !important; }
            .mobile-text-3xl { font-size: 1.5rem !important; }
            .mobile-p-3 { padding: 0.5rem !important; }
            .mobile-p-4 { padding: 0.75rem !important; }
        }
    </style>
</head>
<body>
    <div id="widget-container" class="max-w-2xl mx-auto p-4"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const blogId = params.get('id');
        const EXCHANGE_RATE = 1430;
        const COIN_VALUE = 0.01;

        async function copyAndGo(code, url) {
            if (code) {
                try {
                    await navigator.clipboard.writeText(code);
                    alert(`✅ 쿠폰 코드 "${code}"가 복사되었습니다!\n\n상품 페이지로 이동합니다.`);
                } catch (err) {
                    alert('쿠폰 코드 복사 실패. 수동으로 복사해주세요: ' + code);
                }
            }
            window.open(url, '_blank');
        }

        function toggleCardList() {
            const hiddenCards = document.getElementById('hidden-cards');
            const toggleText = document.getElementById('toggle-text');
            const isHidden = hiddenCards.classList.contains('hidden');
            
            if (isHidden) {
                hiddenCards.classList.remove('hidden');
                toggleText.textContent = '- 접기';
            } else {
                hiddenCards.classList.add('hidden');
                const count = document.querySelectorAll('#hidden-cards > div').length;
                toggleText.textContent = `+ ${count}개 더 보기`;
            }
            
            setTimeout(updateIframeHeight, 100);
        }

        function getPromotionStatus(promotion) {
            if (!promotion || !promotion.start_date || !promotion.end_date) {
                return { status: 'none' };
            }
            const now = new Date();
            const start = new Date(promotion.start_date);
            const end = new Date(promotion.end_date);
            end.setHours(23, 59, 59, 999);
            
            if (now < start) {
                const daysLeft = Math.ceil((start - now) / (1000 * 60 * 60 * 24));
                return { status: 'upcoming', daysLeft, start, end };
            } else if (now >= start && now <= end) {
                return { status: 'active', start, end };
            } else {
                return { status: 'expired' };
            }
        }

        function findBestDiscountCode(price, discountCodes) {
            const applicable = discountCodes.filter(c => price >= c.min_price);
            if (applicable.length === 0) return null;
            return applicable.reduce((best, current) => 
                current.discount > best.discount ? current : best
            );
        }

        function getApplicableCardDiscounts(price, cardDiscounts) {
            return cardDiscounts
                .filter(c => price >= c.min_price)
                .sort((a, b) => b.discount - a.discount);
        }

        function getNextTierInfo(currentPrice, discountItems) {
            const nextTier = discountItems.find(item => item.min_price > currentPrice);
            if (nextTier) {
                const amountNeeded = nextTier.min_price - currentPrice;
                return { nextTier, amountNeeded };
            }
            return null;
        }

        function calculatePrices(product, coupons) {
            const originalPrice = product.original_price;
            const coinDiscountedPrice = originalPrice * (1 - product.coin_discount_percent / 100);
            
            // 셀러 쿠폰 적용
            let afterSellerCoupon = coinDiscountedPrice;
            if (product.seller_coupon && product.seller_coupon.discount > 0) {
                afterSellerCoupon = coinDiscountedPrice - product.seller_coupon.discount;
            }
            
            const bestCode = findBestDiscountCode(afterSellerCoupon, coupons.discount_codes);
            const codeDiscountedPrice = bestCode 
                ? afterSellerCoupon - bestCode.discount 
                : afterSellerCoupon;
            
            const applicableCards = getApplicableCardDiscounts(afterSellerCoupon, coupons.card_discounts);
            
            return {
                original: originalPrice,
                afterCoin: coinDiscountedPrice,
                afterSellerCoupon: afterSellerCoupon,
                afterCode: codeDiscountedPrice,
                bestCode: bestCode,
                applicableCards: applicableCards,
                coinAmount: Math.round((originalPrice * product.coin_discount_percent / 100) / COIN_VALUE),
                sellerCoupon: product.seller_coupon
            };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }
        
        function toKRW(usd) {
            return Math.round(usd * EXCHANGE_RATE).toLocaleString('ko-KR');
        }

        async function loadWidget() {
            const container = document.getElementById('widget-container');

            if (!blogId) {
                container.innerHTML = `
                    <div class="p-4 bg-red-50 border-2 border-red-300 rounded-lg">
                        <div class="flex items-center text-red-700">
                            <span class="mr-2">⚠️</span>
                            <span>블로그 게시글 ID가 필요합니다.</span>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="flex items-center justify-center p-6 bg-gray-100 rounded-lg">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-500"></div>
                    <span class="ml-3 text-gray-600">로딩중...</span>
                </div>
            `;

            try {
                const [productsRes, couponsRes] = await Promise.all([
                    fetch('https://script.google.com/macros/s/AKfycbyoaxpTkVcLZrfxJhMVbnCXy0UIkpj8w8hKiW5_uD-AZZg2LdEe-s1kg5tsOKZRrtmFFQ/exec'),
                    fetch('coupons.json')
                ]);
                
                if (!productsRes.ok) {
                    throw new Error('products.json 파일을 찾을 수 없습니다.');
                }
                
                const productsData = await productsRes.json();
                const product = productsData.products[blogId];
                
                if (!product) {
                    throw new Error(`ID "${blogId}"에 해당하는 상품을 찾을 수 없습니다.`);
                }

                let couponsData = { promotion: null, discount_codes: [], card_discounts: [] };
                let promotionStatus = { status: 'none' };
                
                if (couponsRes.ok) {
                    try {
                        const data = await couponsRes.json();
                        if (data.promotion) {
                            promotionStatus = getPromotionStatus(data.promotion);
                            if (promotionStatus.status === 'active') {
                                couponsData.promotion = data.promotion;
                                couponsData.discount_codes = data.discount_codes || [];
                                couponsData.card_discounts = data.card_discounts || [];
                            } else if (promotionStatus.status === 'upcoming') {
                                couponsData.promotion = data.promotion;
                            }
                        }
                    } catch (e) {
                        console.log('쿠폰 파일 파싱 실패');
                    }
                }
                
                const prices = calculatePrices(product, couponsData);
                const hasDiscounts = promotionStatus.status === 'active' && (prices.bestCode || prices.applicableCards.length > 0);
                const hasCoinDiscount = product.coin_discount_percent > 0;
                const hasSellerCoupon = prices.sellerCoupon && prices.sellerCoupon.discount > 0;
                
                container.innerHTML = `
                    <div class="bg-white rounded-xl shadow-2xl border-2 border-gray-300 overflow-hidden">
                        ${product.image ? `
                            <div class="w-full h-56 bg-gray-100">
                                <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                            </div>
                        ` : ''}
                        
                        <div class="p-6">
                            ${promotionStatus.status === 'upcoming' ? `
                                <div class="mb-4 p-4 mobile-p-3 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg border-2 border-blue-400 text-center">
                                    <div class="text-blue-800 font-bold text-xl mobile-text-lg mb-2">🎉 ${couponsData.promotion.name}</div>
                                    <div class="text-blue-600 text-sm mobile-text-sm mb-2">${formatDate(couponsData.promotion.start_date)} ~ ${formatDate(couponsData.promotion.end_date)}</div>
                                    <div class="bg-white rounded-lg p-3 inline-block border-2 border-blue-300">
                                        <div class="text-blue-500 text-sm mobile-text-sm mb-1">프로모션 시작까지</div>
                                        <div class="text-4xl mobile-text-3xl font-bold text-blue-700">D-${promotionStatus.daysLeft}</div>
                                    </div>
                                </div>
                            ` : promotionStatus.status === 'active' ? `
                                <div class="mb-4 p-3 mobile-p-3 bg-gradient-to-r from-orange-50 to-red-50 rounded-lg border-2 border-orange-400 text-center">
                                    <div class="text-orange-700 font-bold text-lg mobile-text-base">${couponsData.promotion.name}</div>
                                    <div class="text-orange-600 text-sm mobile-text-sm mt-1">${formatDate(couponsData.promotion.start_date)} ~ ${formatDate(couponsData.promotion.end_date)}</div>
                                </div>
                            ` : ''}
                            
                            <h2 class="text-2xl mobile-text-xl font-bold text-gray-800 mb-4">${product.name}</h2>
                            
                            <div class="mb-4 flex flex-wrap gap-2">
                                ${product.links.map((link, idx) => {
                                    const linkText = product.link_texts && product.link_texts[idx] 
                                        ? product.link_texts[idx] 
                                        : `상품 링크 ${idx + 1}`;
                                    return `
                                    <a href="${link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-sm hover:bg-blue-100 transition-colors border border-blue-300">
                                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                        </svg>
                                        ${linkText}
                                    </a>
                                `;
                                }).join('')}
                            </div>
                            
                            <div class="space-y-3 mb-6">
                                <div class="flex justify-between items-center p-3 mobile-p-3 bg-gray-50 rounded-lg border border-gray-300">
                                    <span class="text-gray-600 mobile-text-sm">정가</span>
                                    <div class="text-right">
                                        <span class="text-xl mobile-text-lg font-bold text-gray-400 line-through">$${prices.original.toFixed(2)}</span>
                                        <div class="text-sm mobile-text-sm text-gray-500 mt-0.5">약 ${toKRW(prices.original)}원</div>
                                    </div>
                                </div>
                                
                                ${hasCoinDiscount ? `
                                    <div class="flex justify-between items-center p-3 mobile-p-3 bg-orange-50 rounded-lg border border-orange-300">
                                        <div>
                                            <span class="text-orange-800 font-semibold mobile-text-sm">코인 ${product.coin_discount_percent}% 할인</span>
                                            <div class="text-xs mobile-text-sm text-orange-600">
                                                알리 코인 사용 <span class="font-semibold">(약 ${prices.coinAmount.toLocaleString('ko-KR')}개 필요)</span>
                                            </div>             
                                            <span class="text-gray-600 mobile-text-sm">(할인율이 다르다면 상품을 장바구니에 담고 코인샵에서 확인하세요)</span>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-xl mobile-text-lg font-bold text-orange-700">$${prices.afterCoin.toFixed(2)}</span>
                                            <div class="text-sm mobile-text-sm text-orange-600 mt-0.5">약 ${toKRW(prices.afterCoin)}원</div>
                                        </div>
                                    </div>
                                ` : ''}
                                
                                ${hasSellerCoupon ? `
                                    <div class="p-4 mobile-p-3 bg-gradient-to-r from-yellow-50 to-amber-50 rounded-lg border-2 border-dashed border-yellow-400">
                                        <div class="flex justify-between items-start mb-2">
                                            <div class="flex-1">
                                                <div class="flex items-center gap-2 mb-2">
                                                    <svg class="w-5 h-5 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
                                                    </svg>
                                                    <span class="font-bold text-yellow-800 mobile-text-sm">셀러 쿠폰</span>
                                                </div>
                                                <div class="text-sm mobile-text-sm text-yellow-700">${prices.sellerCoupon.note || '상품 페이지에서 쿠폰 받기'}</div>
                                            </div>
                                            <span class="text-xl mobile-text-lg font-bold text-yellow-700">-$${prices.sellerCoupon.discount}</span>
                                        </div>
                                        <div class="mt-2 p-2 bg-white rounded border border-yellow-300">
                                            <div class="flex justify-between items-center">
                                                <span class="text-yellow-800 font-semibold mobile-text-sm">셀러 쿠폰 적용 후</span>
                                                <div class="text-right">
                                                    <div class="text-xl mobile-text-lg font-bold text-yellow-700">$${prices.afterSellerCoupon.toFixed(2)}</div>
                                                    <div class="text-sm mobile-text-sm text-yellow-600">약 ${toKRW(prices.afterSellerCoupon)}원</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}
                                
                                ${!hasDiscounts ? `
                                    <div class="p-6 bg-gray-50 rounded-lg border-2 border-gray-300 text-center">
                                        <div class="text-gray-600 text-lg font-semibold mb-2">현재는 할인이 없습니다</div>
                                        <div class="text-gray-500 text-sm">다음 프로모션을 기대해주세요!</div>
                                    </div>
                                ` : ''}
                                
                                ${prices.bestCode ? `
                                    <div class="p-4 mobile-p-3 bg-gradient-to-r from-red-50 to-pink-50 rounded-lg border-2 border-dashed border-red-400">
                                        <div class="flex justify-between items-start mb-3">
                                            <div class="flex-1">
                                                <div class="flex items-center gap-2 mb-2">
                                                    <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                                                    </svg>
                                                    <span class="font-bold text-red-800 mobile-text-sm">할인 코드</span>
                                                </div>
                                                <code class="inline-block px-3 py-1 bg-white rounded font-mono text-sm mobile-text-sm font-bold text-red-600 border border-red-400 select-all">${prices.bestCode.code}</code>
                                                <div class="text-xs mobile-text-sm text-red-600 mt-2">${prices.bestCode.note}</div>
                                                <div class="text-sm mobile-text-sm text-red-700 mt-1">$${prices.bestCode.min_price} 이상 구매 시 $${prices.bestCode.discount} 할인</div>
                                                ${(() => {
                                                    const nextCodeInfo = getNextTierInfo(prices.afterSellerCoupon, couponsData.discount_codes);
                                                    if (nextCodeInfo) {
                                                        return `
                                                        <div class="mt-2 p-2 bg-red-100 rounded text-xs mobile-text-sm text-red-700">
                                                            💡 <strong>$${nextCodeInfo.amountNeeded.toFixed(2)}</strong> 더 구매하면 <strong>$${nextCodeInfo.nextTier.discount}</strong> 할인 가능!
                                                        </div>`;
                                                    }
                                                    return '';
                                                })()}
                                            </div>
                                            <span class="text-xl mobile-text-lg font-bold text-red-700">-$${prices.bestCode.discount}</span>
                                        </div>
                                    </div>
                                    
                                    <div class="p-4 mobile-p-3 bg-green-50 rounded-lg border-2 border-green-400">
                                        <div class="flex justify-between items-center">
                                            <span class="text-green-800 font-bold text-lg mobile-text-base">코드 적용 후 가격</span>
                                            <div class="text-right">
                                                <div class="text-3xl mobile-text-2xl font-bold text-green-700">$${prices.afterCode.toFixed(2)}</div>
                                                <div class="text-sm mobile-text-sm text-green-600 mt-1">약 ${toKRW(prices.afterCode)}원</div>
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                            
                            ${prices.applicableCards.length > 0 ? `
                                <div class="mb-6">
                                    <h3 class="font-bold text-lg mobile-text-base mb-3 flex items-center text-purple-700">
                                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
                                        </svg>
                                        추가 카드 할인
                                    </h3>
                                    <div class="space-y-2" id="card-list">
                                        ${prices.applicableCards.slice(0, 3).map((card, index) => {
                                            const finalPrice = prices.afterCode - card.discount;
                                            const nextCardInfo = index === 0 ? getNextTierInfo(prices.afterCode, couponsData.card_discounts) : null;
                                            return `
                                            <div class="p-3 mobile-p-3 bg-purple-50 rounded-lg border border-purple-300">
                                                <div class="flex justify-between items-center">
                                                    <div class="flex-1">
                                                        <div class="font-semibold text-purple-900 mobile-text-sm">${card.card_name}</div>
                                                        <div class="text-xs mobile-text-sm text-purple-600 mt-1">${card.note}</div>
                                                        <div class="text-sm mobile-text-sm text-purple-700 mt-1">
                                                            $${card.min_price} 이상 → <span class="font-bold text-purple-900">$${finalPrice.toFixed(2)}</span>
                                                            <div class="text-xs mobile-text-sm text-purple-600 mt-0.5">(약 ${toKRW(finalPrice)}원)</div>
                                                        </div>
                                                    </div>
                                                    <div class="text-right">
                                                        <div class="text-lg mobile-text-base font-bold text-purple-700">-$${card.discount}</div>
                                                    </div>
                                                </div>
                                                ${nextCardInfo ? `
                                                <div class="mt-2 p-2 bg-purple-100 rounded text-xs mobile-text-sm text-purple-700">
                                                    💡 <strong>$${nextCardInfo.amountNeeded.toFixed(2)}</strong> 더 구매하면 <strong>$${nextCardInfo.nextTier.discount}</strong> 카드 할인 가능!
                                                </div>
                                                ` : ''}
                                            </div>
                                        `;
                                        }).join('')}
                                    </div>
                                    ${prices.applicableCards.length > 3 ? `
                                        <button onclick="toggleCardList()" id="toggle-cards-btn" class="mt-3 w-full py-2 bg-purple-100 hover:bg-purple-200 text-purple-700 font-semibold rounded-lg transition-colors text-sm">
                                            <span id="toggle-text">+ ${prices.applicableCards.length - 3}개 더 보기</span>
                                        </button>
                                        <div id="hidden-cards" class="hidden space-y-2 mt-2">
                                            ${prices.applicableCards.slice(3).map(card => {
                                                const finalPrice = prices.afterCode - card.discount;
                                                return `
                                                <div class="p-3 mobile-p-3 bg-purple-50 rounded-lg border border-purple-300">
                                                    <div class="flex justify-between items-center">
                                                        <div class="flex-1">
                                                            <div class="font-semibold text-purple-900 mobile-text-sm">${card.card_name}</div>
                                                            <div class="text-xs mobile-text-sm text-purple-600 mt-1">${card.note}</div>
                                                            <div class="text-sm mobile-text-sm text-purple-700 mt-1">
                                                                $${card.min_price} 이상 → <span class="font-bold text-purple-900">$${finalPrice.toFixed(2)}</span>
                                                                <div class="text-xs mobile-text-sm text-purple-600 mt-0.5">(약 ${toKRW(finalPrice)}원)</div>
                                                            </div>
                                                        </div>
                                                        <div class="text-right">
                                                            <div class="text-lg mobile-text-base font-bold text-purple-700">-$${card.discount}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                            }).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}
                            
                            ${hasDiscounts ? `
                                <div class="p-4 mobile-p-3 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg border-2 border-blue-400 mb-4">
                                    <div class="text-center">
                                        <div class="text-sm mobile-text-sm text-blue-700 mb-1">최대 절약 가능 금액</div>
                                        <div class="text-3xl mobile-text-2xl font-bold text-blue-700">
                                            $${(prices.original - prices.afterCode).toFixed(2)}
                                            ${prices.applicableCards.length > 0 ? `<span class="text-lg mobile-text-base">~ $${(prices.original - prices.afterCode + Math.max(...prices.applicableCards.map(c => c.discount))).toFixed(2)}</span>` : ''}
                                        </div>
                                        <div class="text-sm mobile-text-sm text-blue-600 mt-1">${((prices.original - prices.afterCode) / prices.original * 100).toFixed(0)}% 할인</div>
                                    </div>
                                </div>
                            ` : ''}
                            
                            <button onclick="copyAndGo('${prices.bestCode ? prices.bestCode.code : ''}', '${product.links[0]}')" class="flex items-center justify-center gap-2 w-full py-4 mobile-py-3 bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold rounded-lg transition-all transform hover:scale-105 shadow-lg text-lg mobile-text-base">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                </svg>
                                ${prices.bestCode ? '쿠폰 복사하고 구매하기' : '구매하기'}
                            </button>
                            
                            <div class="mt-4 pt-4 border-t border-gray-200 text-xs text-gray-500 text-center">
                                ${hasDiscounts ? '<div>💡 결제 시 위 할인 코드를 입력하고 해당 카드로 결제하세요</div>' : ''}
                                <div class="mt-2">마지막 업데이트: ${new Date(product.last_updated).toLocaleString('ko-KR')}</div>
                                <div class="text-xs text-gray-400 mt-1">환율: 1달러 = ${EXCHANGE_RATE}원 | 코인: 1개 = ${COIN_VALUE}</div>
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                container.innerHTML = `
                    <div class="p-4 bg-red-50 border-2 border-red-300 rounded-lg">
                        <div class="flex items-center text-red-700">
                            <span class="mr-2">❌</span>
                            <span>${error.message}</span>
                        </div>
                    </div>
                `;
            }
        }

        function updateIframeHeight() {
            try {
                const height = Math.max(
                    document.body.scrollHeight,
                    document.documentElement.scrollHeight,
                    document.body.offsetHeight,
                    document.documentElement.offsetHeight
                );
                window.parent.postMessage({ type: 'resize', height: height }, '*');
            } catch (e) {}
        }

        async function init() {
            await loadWidget();
            setTimeout(updateIframeHeight, 100);
            setTimeout(updateIframeHeight, 300);
            setTimeout(updateIframeHeight, 500);
            setTimeout(updateIframeHeight, 1000);
        }

        init();
        window.addEventListener('resize', updateIframeHeight);
        window.addEventListener('load', () => setTimeout(updateIframeHeight, 500));
    </script>
</body>
</html>
