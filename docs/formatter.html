<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 문구 만들기</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f3;color:#25211f;font:14px -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}main{max-width:760px;margin:auto;padding:32px 20px}h1{font-size:23px;margin:0 0 6px}p{color:#827a75;line-height:1.5}.panel{margin-top:20px;background:#fff;border:1px solid #eae6e3;border-radius:10px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;font-size:12px;color:#514b47}input,select,textarea{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #ded9d6;border-radius:5px;background:#fff;color:#25211f;font:inherit}textarea{resize:vertical;line-height:1.6}.full{grid-column:1/-1}.output{font-size:15px;min-height:160px;background:#faf9f8}.actions{display:flex;align-items:center;gap:12px;margin-top:12px}button{border:0;border-radius:5px;padding:11px 18px;background:#d84332;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.status{font-size:12px;color:#817973}.hint{font-size:11px;color:#8d8580;font-weight:400;margin-top:5px}.item-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item-row strong{flex:1}.item-row button{padding:7px 10px;background:#f3efed;color:#655}.back{color:#b74330;text-decoration:none;font-size:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:22px 14px}}
</style></head><body><main><a class="back" href="./">← 홈페이지</a><h1>상품 문구 만들기</h1><p>상품과 할인을 선택하면 공유할 문구가 완성됩니다.</p><section class="panel"><div class="grid"><label class="full">상품 선택<select id="product"><option value="">상품 불러오는 중…</option></select><div class="hint" id="load-status"></div></label><label>상품명<input id="name" placeholder="토핑 e2x2 otg"></label><label>상품 가격 ($)<input id="price" type="number" min="0" step="0.01" placeholder="173"></label><label class="full">한 줄 설명<input id="description" placeholder="점점 가격이 오르네요"></label><label>코인 할인 금액 ($)<input id="coin" type="number" min="0" step="0.01" placeholder="5"></label><label>쿠폰<select id="coupon"><option value="">쿠폰 없음</option></select></label><label>카드 할인<select id="card"><option value="">카드 할인 없음</option></select></label><label>상품 링크<input id="link" type="url" placeholder="https://a.aliexpress.com/..."></label><label>쿠폰 할인 직접 입력 ($)<input id="coupon-amount" type="number" min="0" step="0.01" placeholder="0"></label><label>쿠폰 코드 직접 입력<input id="coupon-code" placeholder="KFSL17"></label><label>카드 할인 직접 입력 ($)<input id="card-amount" type="number" min="0" step="0.01" placeholder="0"></label></div></section><section class="panel"><div class="actions"><button id="add-item" type="button">상품 담기 +</button><span class="status">현재 입력한 상품을 목록에 추가합니다.</span></div><div id="item-list"></div></section><section class="panel"><label>완성된 문구<textarea id="output" class="output" readonly></textarea></label><div class="actions"><button id="copy" type="button">문구 복사</button><span id="copy-status" class="status" aria-live="polite"></span></div><p class="hint">표시 금액은 입력한 값의 단순 계산 결과입니다. 실제 결제 조건과 금액을 확인해 주세요.</p></section><section class="panel"><label>HTML 코드<textarea id="html-output" class="output" readonly></textarea></label><div class="actions"><button id="copy-html" type="button">HTML 복사</button><span id="html-status" class="status" aria-live="polite"></span></div></section></main><script src="data.js"></script><script src="formatter.js"></script></body></html>
